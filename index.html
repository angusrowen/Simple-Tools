<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Australian Financial Calculators | AusCalc</title>
  <meta name="description" content="Free Australian financial calculators — income tax, home loans, HECS, super and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <header class="site-header">
    <div class="logo"><i class="fa-solid fa-calculator"></i> AusCalc</div>
    <nav><a href="index.html" class="active">Home</a></nav>
  </header>
  <section class="page-hero">
    <div class="hero-icon"><i class="fa-solid fa-calculator"></i></div>
    <h1>Australian Financial Calculators</h1>
    <p>Free tools to help Australians make smarter financial decisions.</p>
  </section>
  <main class="site-main">
    <div class="card-grid" id="cardGrid"></div>
  </main>
  <footer class="site-footer">
    <span>&copy; 2025 AusCalc. For general information only &mdash; not financial advice.</span>
    <div class="footer-links"><a href="index.html">Home</a></div>
  </footer>
  <script src="js/utils.js"></script>
  <script>
    fetch('data/calculators.json')
      .then(r => r.json())
      .then(calcs => {
        document.getElementById('cardGrid').innerHTML = calcs.map(c => `
          <a class="calc-card" href="${c.file}" style="--card-accent:${c.accent}">
            <div class="card-icon"><i class="fa-solid ${c.icon}"></i></div>
            <div class="card-title">${c.title}</div>
            <div class="card-desc">${c.description}</div>
            <div class="card-cta">Open Calculator <i class="fa-solid fa-arrow-right fa-xs"></i></div>
          </a>`).join('');
      })
      .catch(() => {
        document.getElementById('cardGrid').innerHTML =
          '<p style="color:var(--muted);padding:1rem">Could not load calculators. View this site over HTTP, not as a local file.</p>';
      });
  </script>
</body>
</html>
